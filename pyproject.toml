[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tervatrix-rtl"
version = "1.0.1"
description = "Correct right-to-left text for Hebrew and Arabic: LTR isolates for numbers, URLs and time ranges, and the RLM line-start fix. No dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Tervatrix" }]
keywords = [
    "rtl",
    "bidi",
    "hebrew",
    "arabic",
    "i18n",
    "l10n",
    "unicode",
    "bidirectional",
    "text",
    "whatsapp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Hebrew",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mhamedmohammed92-arch/tervatrix-rtl"
Repository = "https://github.com/mhamedmohammed92-arch/tervatrix-rtl"
Issues = "https://github.com/mhamedmohammed92-arch/tervatrix-rtl/issues"
Changelog = "https://github.com/mhamedmohammed92-arch/tervatrix-rtl/blob/main/CHANGELOG.md"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tervatrix_rtl = ["py.typed"]
